# Coolify / Nixpacks — backend API only
# Coolify: set Base Directory to `backend` OR use Dockerfile (preferred).
# If Base Directory is repo root, use the install/build cmds below via custom plan.

providers = ["node"]

[variables]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "22"
PORT = "3141"

[phases.install]
cmds = ["npm ci --prefix backend"]

[phases.build]
cmds = ["npx tsc -p backend/tsconfig.json"]

[start]
cmd = "node backend/dist/index.js"
