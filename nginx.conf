# GARIL AI API — nginx reverse proxy (backend only)
# server_name → your API host, e.g. api.example.com
# Upstream: Node Fastify on 127.0.0.1:3141

upstream garil_backend {
	server 127.0.0.1:3141;
	keepalive 32;
}

server {
	listen 80;
	listen [::]:80;
	server_name API_DOMAIN;

	client_max_body_size 50m;
	proxy_connect_timeout 60s;
	proxy_send_timeout 300s;
	proxy_read_timeout 300s;

	location /api/ {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
		proxy_pass http://garil_backend;
	}

	location /ws {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_pass http://garil_backend;
	}

	location /api/health {
		proxy_pass http://garil_backend;
	}

	location / {
		return 404 '{"error":"API only — use /api or /ws"}';
		add_header Content-Type application/json;
	}
}
